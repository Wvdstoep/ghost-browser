<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0d100d;color:#dce2d9}
  .w{max-width:520px;margin:0 auto;padding:48px 22px}
  h1{font-size:26px;letter-spacing:-.01em;color:#eef2ec;margin:0 0 4px}
  p{color:#9aa598;font-size:14px;margin:0 0 26px}
  .g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  a.card{display:block;background:#161a15;border:1px solid #282e26;border-radius:14px;padding:16px;color:#dce2d9;text-decoration:none}
  a.card b{color:#4cc35e;display:block;font-size:15px}
  a.card span{font-size:12px;color:#6d786b}
</style></head><body>
<div class="w">
  <h1>Ghost Browser · Mobile</h1>
  <p>A real browser on your device — driven by you or the backend. Type a URL above, or jump in:</p>
  <div class="g">
    <a class="card" href="https://dashboard.rapyd.net/sign-up"><b>Rapyd</b><span>sandbox sign-up</span></a>
    <a class="card" href="https://bugcrowd.com"><b>Bugcrowd</b><span>programs</span></a>
    <a class="card" href="https://hackerone.com"><b>HackerOne</b><span>programs</span></a>
    <a class="card" href="https://www.google.com"><b>Google</b><span>search</span></a>
  </div>
</div>
</body></html>
