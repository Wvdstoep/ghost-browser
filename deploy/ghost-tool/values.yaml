# ghost-tool — the installable Ghost Browser. A real logged-in browser with an HTTP API + on-board
# agent, running in its own namespace with its own PERSISTENT profile volume. One owner per install.
image:
  repository: wvdstoep/ghost-browser
  tag: v174
  pullPolicy: IfNotPresent

# SSO-only: disable local password accounts so the install is entered ONLY through your platform's SSO
# handoff (set leadflowSecret too). Leave false for a standalone install with its own owner account.
ssoOnly: false

# Private image pull (the image is private — self-hosting is licensed). Provide ONE of:
#   dockerconfigjson : base64 of a docker config.json with pull creds you were granted -> creates a
#                      ghost-tool-regcred secret, or
#   existingSecret   : the name of a kubernetes.io/dockerconfigjson secret you already created.
# Leave both empty only if the image is public.
imagePull:
  existingSecret: ""
  dockerconfigjson: ""

# The bearer API key programs use (Authorization: Bearer <key>). Leave empty to auto-generate a stable
# one on first install (kept across upgrades via a lookup). Format: "<key>:<plan>" or a JSON keys object.
apiKey: ""

# Platform single sign-on. Set to your platform's LEADFLOW_JWT_SECRET so platform users can SSO in;
# leave empty to use the console's own password login only. (SSO is single-owner: one account per install.)
leadflowSecret: ""

# Comma-separated emails allowed the cross-tenant superadmin overview.
superadminUsers: ""

timezone: "Europe/Amsterdam"

# The profile volume: profiles, accounts, roles, workflows, file-assets and the tailnet state all live
# here. ReadWriteOnce — this tool is a single stateful pod (replicas:1), never two at once.
persistence:
  size: 10Gi
  storageClass: ""       # empty = cluster default

service:
  port: 80

# Ingress for the private URL. Disabled by default — enable + set host, or reach it with
# `kubectl -n <ns> port-forward svc/ghost-tool 3000:80` and open http://localhost:3000.
ingress:
  enabled: false
  className: ""          # e.g. "traefik" or "nginx"; empty uses the cluster default
  host: ""
  tls: false
  annotations: {}

# Headful Chromium + Xvfb + ffmpeg is heavy — size accordingly. Chromium image is amd64-only.
resources:
  requests: { cpu: 250m, memory: 1Gi }
  limits:   { cpu: "2", memory: 4Gi }
