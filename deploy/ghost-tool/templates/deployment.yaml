{{- /*
  Per-install secrets. The API key is REQUIRED (the app refuses to serve without API_KEYS), so if the
  installer did not set one we generate a stable key: reuse the existing Secret's value on an upgrade
  (via lookup) and only mint a fresh one on the very first install. SSO secret + superadmin list are
  optional and only written when provided.
*/}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "ghost-tool-secrets") -}}
{{- $apiKey := .Values.apiKey -}}
{{- if not $apiKey -}}
  {{- if and $existing $existing.data (index $existing.data "API_KEYS") -}}
    {{- $apiKey = (index $existing.data "API_KEYS" | b64dec) -}}
  {{- else -}}
    {{- $apiKey = printf "gb_%s:team" (randAlphaNum 32) -}}
  {{- end -}}
{{- end -}}
{{- /* Which pull secret the pod uses: an existing one, or ghost-tool-regcred minted from dockerconfigjson. */ -}}
{{- $pullSecret := "" -}}
{{- if .Values.imagePull.existingSecret -}}{{- $pullSecret = .Values.imagePull.existingSecret -}}
{{- else if .Values.imagePull.dockerconfigjson -}}{{- $pullSecret = "ghost-tool-regcred" -}}{{- end -}}
{{- if .Values.imagePull.dockerconfigjson }}
apiVersion: v1
kind: Secret
metadata:
  name: ghost-tool-regcred
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.imagePull.dockerconfigjson }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: ghost-tool-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  API_KEYS: {{ $apiKey | quote }}
  {{- if .Values.leadflowSecret }}
  LEADFLOW_JWT_SECRET: {{ .Values.leadflowSecret | quote }}
  {{- end }}
  {{- if .Values.superadminUsers }}
  SUPERADMIN_USERS: {{ .Values.superadminUsers | quote }}
  {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ghost-tool-profiles
  namespace: {{ .Release.Namespace }}
  labels: { app: ghost-tool }
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost-tool
  namespace: {{ .Release.Namespace }}
  labels: { app: ghost-tool }
spec:
  replicas: 1
  # RWO volume + browser sessions live IN the pod: never run two at once. Recreate, don't roll.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: ghost-tool }
  template:
    metadata:
      labels: { app: ghost-tool }
    spec:
      {{- if $pullSecret }}
      imagePullSecrets:
        - name: {{ $pullSecret }}
      {{- end }}
      # Chromium/Playwright image is amd64-only — never schedule onto an ARM home node.
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        seccompProfile: { type: RuntimeDefault }
        # The image runs as non-root pwuser (gid 1001); fsGroup makes the /profiles PVC group-writable,
        # else a fresh root-owned volume gives EACCES on /profiles/.auth.json at first sign-in.
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: ghost-browser
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 3000 }]
          env:
            - name: PORT
              value: "3000"
            - name: PROFILE_DIR
              value: /profiles
            - name: API_KEYS
              valueFrom: { secretKeyRef: { name: ghost-tool-secrets, key: API_KEYS } }
            {{- if .Values.leadflowSecret }}
            - name: LEADFLOW_JWT_SECRET
              valueFrom: { secretKeyRef: { name: ghost-tool-secrets, key: LEADFLOW_JWT_SECRET } }
            {{- end }}
            {{- if and .Values.ssoOnly .Values.leadflowSecret }}
            # SSO-only: no local password accounts — entered only through the platform SSO handoff.
            - name: SSO_ONLY
              value: "true"
            {{- end }}
            {{- if .Values.superadminUsers }}
            - name: SUPERADMIN_USERS
              valueFrom: { secretKeyRef: { name: ghost-tool-secrets, key: SUPERADMIN_USERS } }
            {{- end }}
            {{- if .Values.timezone }}
            - name: TIMEZONE
              value: {{ .Values.timezone | quote }}
            {{- end }}
          # Unprivileged, but NOT readOnlyRootFilesystem: Xvfb, ffmpeg and the userspace tailscaled all
          # need to write, and /profiles is a real volume. The image already runs as a non-root user.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: profiles
              mountPath: /profiles
          readinessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{ .Values.resources | toYaml | nindent 12 }}
      volumes:
        - name: profiles
          persistentVolumeClaim:
            claimName: ghost-tool-profiles
