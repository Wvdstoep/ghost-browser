name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        working-directory: mobile
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :shared:desktopTest :desktop:test :shared:wasmJsBrowserDistribution
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-browser-debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and package the desktop app
        working-directory: mobile
        run: ./gradlew.bat :shared:desktopTest :desktop:test :desktop:createDistributable --no-daemon --max-workers=2
      - name: Zip the portable Windows app
        run: Compress-Archive -Path 'mobile/desktop/build/compose/binaries/main/app/*' -DestinationPath ghost-browser-desktop-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-browser-desktop-windows
          path: ghost-browser-desktop-windows.zip
          if-no-files-found: error
